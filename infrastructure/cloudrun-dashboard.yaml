apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pearls-aqi-dashboard
spec:
  template:
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/pearls-aqi-dashboard:latest
          env:
            - name: APP_ENV
              value: production
            - name: AQI_FEATURE_STORE_BACKEND
              value: local
            - name: AQI_API_BASE_URL
              value: https://pearls-aqi-api.example.com
            - name: API_ACCESS_TOKEN
              value: ""
